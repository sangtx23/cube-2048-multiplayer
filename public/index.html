<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>2048 Cube - King Arena Ultra Max Multiplayer</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #030712; font-family: sans-serif; touch-action: none; user-select: none; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }
        #start-screen {
            position: absolute; inset: 0; background: #030712;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #name-input { padding: 12px; font-size: 18px; border-radius: 25px; border: 2px solid #fbbf24; width: 220px; text-align: center; margin-bottom: 15px; outline: none; background: #1f2937; color: white; }
        #start-btn { padding: 12px 50px; font-size: 18px; background: #fbbf24; color: black; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(251,191,36,0.4); }
        #start-btn:hover { background: #f59e0b; transform: scale(1.05); }
        #ui { position: absolute; inset: 0; pointer-events: none; display: none; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(17,24,39,0.85); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: white; width: 220px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); display: none; }
        .lb-title { font-weight: bold; color: #fbbf24; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .lb-list { font-size: 14px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
        #toggle-lb-btn { position: absolute; top: 15px; right: 15px; background: #fbbf24; color: black; padding: 8px 15px; border-radius: 20px; font-weight: bold; display: none; pointer-events: auto; cursor: pointer; z-index: 10; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #fbbf24; margin-bottom: 30px; font-size: 32px; font-weight: 800; letter-spacing: 1px;">2048 CUBE ARENA</h1>
        <input type="text" id="name-input" placeholder="Nhập tên của bạn..." maxlength="14">
        <button id="start-btn">VÀO TRẬN</button>
    </div>

    <div id="ui">
        <div id="toggle-lb-btn">BXH</div>
        <div id="leaderboard">
            <div class="lb-title">BẢNG XẾP HẠNG</div>
            <div id="lb-list"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        let gameRunning = false;
        let myAngle = 0;
        
        let lastClientDashTime = 0; 
        let lastTapTime = 0; // Biến tạm này đặt ở client là hoàn toàn chính xác

        let players = {};
        let cubes = [];
        let items = [];
        let clientFireworks = [];

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const nameInput = document.getElementById('name-input');
        const lbList = document.getElementById('lb-list');
        const lbBox = document.getElementById('leaderboard');
        const toggleLbBtn = document.getElementById('toggle-lb-btn');

        toggleLbBtn.onclick = (e) => {
            e.stopPropagation();
            if(lbBox.style.display === 'none' || lbBox.style.display === '') {
                lbBox.style.display = 'block';
            } else {
                lbBox.style.display = 'none';
            }
        };

        startBtn.onclick = () => {
            let name = nameInput.value.trim();
            startScreen.style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            
            if (window.innerWidth <= 768) {
                toggleLbBtn.style.display = 'block';
            } else {
                lbBox.style.display = 'block';
            }
            
            if (audioCtx.state === 'suspended') audioCtx.resume();

            gameRunning = true;
            socket.emit('joinGame', { name: name });
            setTimeout(() => { resize(); window.scrollTo(0, 1); }, 400);
            animate();
        };

        socket.on('gameTick', (data) => {
            players = data.players;
            cubes = data.cubes;
            items = data.items;
        });

        socket.on('playerKilled', (data) => {
            if (data.fireworks && players[data.killerId]) {
                let kp = players[data.killerId];
                if(kp && kp.body && kp.body[0]) {
                    spawnClientFireworks(kp.body[0].x, kp.body[0].y, kp.color);
                    playBeep(580, 0.25);
                }
            }
        });

        // Hàm tạo hiệu ứng hạt pháo hoa đặt ở Client (index)
        function spawnClientFireworks(x, y, color) {
            for(let i=0; i<25; i++) {
                clientFireworks.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    alpha: 1.0,
                    color: color
                });
            }
        }

        function drawGrid(camX, camY) {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const size = 60;
            const startX = Math.floor((camX - width / 2) / size) * size;
            const startY = Math.floor((camY - height / 2) / size) * size;
            const endX = Math.ceil((camX + width / 2) / size) * size;
            const endY = Math.ceil((camY + height / 2) / size) * size;

            for (let x = startX; x <= endX; x += size) {
                ctx.beginPath();
                ctx.moveTo(x - camX + width / 2, startY - camY + height / 2);
                ctx.lineTo(x - camX + width / 2, endY - camY + height / 2);
                ctx.stroke();
            }
            for (let y = startY; y <= endY; y += size) {
                ctx.beginPath();
                ctx.moveTo(startX - camX + width / 2, y - camY + height / 2);
                ctx.lineTo(endX - camX + width / 2, y - camY + height / 2);
                ctx.stroke();
            }
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            socket.emit('move', myAngle);

            let me = players[socket.id];
            let camX = 1800, camY = 1800;
            if (me && me.body && me.body[0]) {
                camX = me.body[0].x;
                camY = me.body[0].y;
            }

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            drawGrid(camX, camY);

            cubes.forEach(c => {
                let screenX = c.x - camX + width / 2;
                let screenY = c.y - camY + height / 2;
                if (screenX > -30 && screenX < width + 30 && screenY > -30 && screenY < height + 30) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(screenX - 12, screenY - 12, 24, 24);
                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(c.value, screenX, screenY);
                }
            });

            items.forEach(it => {
                let screenX = it.x - camX + width / 2;
                let screenY = it.y - camY + height / 2;
                ctx.beginPath();
                ctx.arc(screenX, screenY, 15, 0, Math.PI * 2);
                ctx.fillStyle = it.type === 'magnet' ? '#3b82f6' : it.type === 'shield' ? '#10b981' : '#a855f7';
                ctx.fill();
            });

            for (let i = clientFireworks.length - 1; i >= 0; i--) {
                let f = clientFireworks[i];
                f.x += f.vx; f.y += f.vy; f.alpha -= 0.02;
                if (f.alpha <= 0) { clientFireworks.splice(i, 1); continue; }
                let screenX = f.x - camX + width / 2;
                let screenY = f.y - camY + height / 2;
                ctx.save();
                ctx.globalAlpha = f.alpha;
                ctx.fillStyle = f.color;
                ctx.beginPath(); ctx.arc(screenX, screenY, 3, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            for (let id in players) {
                let p = players[id];
                if (!p.body || p.body.length === 0) continue;

                for (let i = p.body.length - 1; i >= 0; i--) {
                    let node = p.body[i];
                    let screenX = node.x - camX + width / 2;
                    let screenY = node.y - camY + height / 2;
                    let radius = i === 0 ? (42 + Math.sqrt(p.score) * 1.5) : 22;

                    ctx.fillStyle = p.color;
                    ctx.fillRect(screenX - radius, screenY - radius, radius * 2, radius * 2);

                    ctx.fillStyle = 'white';
                    ctx.font = i === 0 ? 'bold 15px sans-serif' : '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(node.value, screenX, screenY);
                }

                let head = p.body[0];
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, head.x - camX + width / 2, head.y - camY + height / 2 - 55);
            }

            let sorted = Object.values(players).sort((a, b) => b.score - a.score).slice(0, 7);
            let lbHTML = '';
            sorted.forEach((p, idx) => {
                let isMe = p.id === socket.id ? ' style="color:#38bdf8; font-weight:bold;"' : '';
                lbHTML += `<div class="lb-list"${isMe}><span>${idx + 1}. ${p.name}</span> - <span>${p.score}</span></div>`;
            });
            lbList.innerHTML = lbHTML;

            let timeLeft = Math.ceil((20000 - (Date.now() - lastClientDashTime)) / 1000);
            ctx.textAlign = 'left';
            if (timeLeft > 0 && timeLeft <= 20) {
                ctx.fillStyle = "rgba(254, 240, 138, 1)";
                ctx.font = "bold 18px sans-serif";
                ctx.fillText("Tăng tốc hồi chiêu: " + timeLeft + "s", 25, height - 35);
            } else {
                ctx.fillStyle = "rgba(74, 222, 128, 1)";
                ctx.font = "bold 18px sans-serif";
                ctx.fillText("Tăng tốc: NHẤP ĐÚP CHUỘT / TAP ĐÚP 2 LẦN", 25, height - 35);
            }
        }

        const moveInput = (e) => {
            if (!gameRunning) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            myAngle = Math.atan2(y - height / 2, x - width / 2);
        };

        window.addEventListener('mousemove', moveInput);
        window.addEventListener('touchmove', (e) => { if (gameRunning) e.preventDefault(); moveInput(e); }, { passive: false });

        function triggerDash() {
            let now = Date.now();
            if (now - lastClientDashTime >= 20000) {
                lastClientDashTime = now;
                socket.emit('setMouseDown', true);
                
                setTimeout(() => {
                    socket.emit('setMouseDown', false);
                }, 2000);
            }
        }

        // Nhấp đúp chuột trên PC
        window.addEventListener('mousedown', (e) => {
            let now = Date.now();
            if (now - lastTapTime < 300) { 
                triggerDash();
            }
            lastTapTime = now;
        });

        // Chạm đúp 2 lần trên điện thoại
        window.addEventListener('touchstart', (e) => {
            let now = Date.now();
            if (now - lastTapTime < 350) { 
                triggerDash();
            }
            lastTapTime = now;
        });

    </script>
</body>
</html>
