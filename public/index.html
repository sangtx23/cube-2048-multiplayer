<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimal-ui">
    <title>2048 Cube - King Arena Ultra Max Multiplayer</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: #030712; font-family: sans-serif; touch-action: none; user-select: none; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }
        #start-screen {
            position: absolute; inset: 0; background: #030712;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #name-input { padding: 12px; font-size: 18px; border-radius: 25px; border: 2px solid #fbbf24; width: 220px; text-align: center; margin-bottom: 15px; outline: none; background: #1f2937; color: white; }
        #start-btn { padding: 12px 50px; font-size: 18px; background: #fbbf24; color: #000; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; box-shadow: 0 0 15px #fbbf24; }
        
        /* GIAO DIỆN UI THÔNG MINH */
        #ui { position: absolute; top: 12px; left: 12px; color: white; pointer-events: none; z-index: 10; display: none; font-size: 14px; text-shadow: 1px 1px 2px black; max-width: 45%; }
        #ui br { display: none; } 
        #ui #chain-text { margin-left: 5px; color: #fbbf24; font-weight: bold; }

        /* BẢNG XẾP HẠNG TỰ CO GIÃN THEO THIẾT BỊ */
        #leaderboard {
            position: absolute; top: 12px; right: 12px; background: rgba(3, 7, 18, 0.9);
            padding: 10px; border-radius: 10px; color: white; min-width: 200px; z-index: 95;
            display: none; border: 1px solid #fbbf24; box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
            transition: all 0.3s ease;
        }
        .lb-title { margin: 0 0 6px 0; text-align: center; color: #fbbf24; font-size: 14px; border-bottom: 1px dashed rgba(251, 191, 36, 0.4); padding-bottom: 4px; font-weight: bold; cursor: pointer; }
        .lb-item { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; padding: 2px 4px; border-radius: 4px; }
        .lb-you { background: rgba(251, 191, 36, 0.2); color: #fde047; font-weight: bold; border: 1px dashed #fbbf24; }
        .lb-top1 { color: #facc15; font-weight: bold; }
        
        /* Nút ẩn/hiển thị nhanh bảng xếp hạng dành riêng cho Mobile */
        #toggle-lb-btn {
            display: none; position: absolute; top: 12px; right: 12px; z-index: 96;
            background: #fbbf24; color: black; border: none; padding: 8px 14px;
            font-weight: bold; font-size: 13px; border-radius: 20px; cursor: pointer;
            box-shadow: 0 0 8px #fbbf24;
        }

        #kill-feed { position: absolute; bottom: 20px; left: 12px; z-index: 10; color: #ef4444; font-weight: bold; font-size: 14px; text-shadow: 0 0 4px black; pointer-events: none; }
        
        /* Dải chữ thông báo Marquee */
        #mega-announcement-container {
            position: absolute; top: 20%; left: 0; width: 100%; overflow: hidden;
            white-space: nowrap; pointer-events: none; z-index: 90; display: none;
            background: rgba(239, 68, 68, 0.15); border-top: 2px dashed #f59e0b; border-bottom: 2px dashed #f59e0b;
            padding: 8px 0;
        }
        #mega-announcement {
            display: inline-block; font-size: 24px; font-weight: bold; color: #fde047;
            text-shadow: 0 0 8px #ef4444, 0 0 18px #f59e0b;
            animation: marqueeText 10s linear infinite;
        }
        #speed-timer-ui {
            margin-top: 6px; padding: 4px 8px; background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff; border-radius: 6px; display: none; color: #00ffff;
            font-weight: bold; font-size: 12px; width: fit-content;
            box-shadow: 0 0 6px rgba(0, 255, 255, 0.4);
        }
        @keyframes marqueeText {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* 📱 ĐIỀU CHỈNH ĐẶC BIỆT KHI CHƠI TRÊN ĐIỆN THOẠI (MÀN HÌNH < 768PX) */
        @media (max-width: 768px) {
            #leaderboard {
                display: none !important; /* Mặc định giấu bảng xếp hạng to */
                top: 55px; right: 12px; min-width: 180px; max-height: 55vh; overflow-y: auto;
            }
            #leaderboard.open { display: block !important; } /* Hiện bảng to khi bấm nút */
            #toggle-lb-btn { display: block; } /* Bật nút kích hoạt nhanh */
            #ui { font-size: 12px; top: 12px; }
            #ui div:last-child { display: none !important; } /* Giấu dòng chữ hướng dẫn để lấy diện tích */
            #mega-announcement { font-size: 16px; }
        }
    </style>
