<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 Cube - King Arena Ultra Max Multiplayer</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #030712; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 4. MÀN HÌNH CHỜ TRƯỚC KHI TẢI GAME (CUSTOM SPLASH SCREEN THAY CHO RENDER) */
        #custom-loader-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a, #020617);
            z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #ffffff; transition: opacity 0.5s ease;
        }
        .loader-logo { font-size: 42px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; letter-spacing: 2px; }
        .loader-spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fbbf24; animation: spin-loader 1s linear infinite; margin-bottom: 20px; }
        .loader-text { font-size: 14px; font-weight: 600; color: #94a3b8; letter-spacing: 1px; }
        @keyframes spin-loader { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 5. GIAO DIỆN BẮT BUỘC XOAY MÀN HÌNH NGANG (LANDSCAPE LOCK WARNING) */
        #landscape-lock-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #090d16; z-index: 999999; display: none;
            flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px;
        }
        .phone-icon { width: 60px; height: 100px; border: 4px solid #fbbf24; border-radius: 10px; position: relative; animation: rotate-phone 2s ease-in-out infinite; margin-bottom: 30px; }
        .phone-icon::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; background: #fbbf24; border-radius: 50%; }
        @keyframes rotate-phone { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }
        .lock-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; color: #fbbf24; }
        .lock-desc { font-size: 14px; color: #94a3b8; max-width: 300px; line-height: 1.5; }

        canvas { display: block; width: 100vw; height: 100vh; background-color: #0b0f19; }

        /* 3. THIẾT KẾ NÚT BẤM TĂNG TỐC X3 Ở GÓC DƯỚI BÊN TRÁI MÀN HÌNH */
        #skill-dash-btn {
            position: fixed; bottom: 25px; left: 25px; width: 85px; height: 85px;
            border-radius: 50%; background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: 4px solid #ffffff; color: white; font-weight: 900; font-size: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); z-index: 9999; cursor: pointer;
            overflow: hidden; outline: none; touch-action: manipulation; display: none;
        }
        #skill-dash-btn:active { transform: scale(0.9); }
        .btn-text-layer { position: absolute; width: 100%; text-align: center; top: 50%; transform: translateY(-50%); z-index: 3; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
        #dash-cooldown-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0, 0, 0, 0.75); z-index: 2; transition: height 0.1s linear; }

        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1e1b4b 0%, #030712 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; padding: 20px; }
        .title-container { text-align: center; margin-bottom: 30px; animation: pulse 2s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.03); } }
        h1 { margin: 0; font-size: 48px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(to right, #fbbf24, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 12px rgba(0,0,0,0.3); }
        .subtitle { font-size: 14px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 4px; margin-top: 5px; }
        .card { background: rgba(15, 23, 42, 0.6); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px; }
        input { width: 100%; padding: 14px 20px; border-radius: 12px; border: 2px solid #3f3f46; background: #09090b; color: white; font-size: 16px; outline: none; transition: all 0.3s; text-align: center; font-weight: 600; }
        input:focus { border-color: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,0.3); }
        #start-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(to right, #fbbf24, #f59e0b); color: #000; font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(251,191,36,0.4); text-transform: uppercase; letter-spacing: 1px; }
        #start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(251,191,36,0.6); }
        #ui { position: fixed; top: 20px; left: 20px; color: white; font-size: 18px; font-weight: bold; font-family: monospace; z-index: 10; display: none; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); background: rgba(0,0,0,0.4); padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        #leaderboard { position: fixed; top: 20px; right: 20px; color: white; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px); padding: 15px 20px; border-radius: 15px; font-size: 14px; z-index: 10; min-width: 240px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); display: none; }
        #leaderboard h3 { margin: 0 0 12px 0; text-align: center; color: #fbbf24; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-weight: 800; }
        .lb-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-family: monospace; font-size: 14px; font-weight: 600; padding: 4px 6px; border-radius: 4px; }
        .lb-item.self { background: rgba(251,191,36,0.2); color: #fbbf24; border-left: 3px solid #fbbf24; }
        #kill-feed { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; z-index: 10; font-weight: bold; pointer-events: none; text-align: center; max-height: 120px; overflow: hidden; display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 500px; }
        .feed-msg { background: rgba(0, 0, 0, 0.6); padding: 6px 16px; border-radius: 20px; font-size: 13px; animation: slideUp 0.3s ease-out; border: 1px solid rgba(255,255,255,0.05); width: fit-content; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #toggle-lb-btn { position: fixed; top: 20px; right: 20px; z-index: 11; background: #fbbf24; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="custom-loader-screen">
        <div class="loader-logo">2048 CUBE</div>
        <div class="loader-spinner"></div>
        <div class="loader-text">ĐANG KẾT NỐI ĐẤU TRƯỜNG...</div>
    </div>

    <div id="landscape-lock-overlay">
        <div class="phone-icon"></div>
        <div class="lock-title">Vui lòng xoay ngang màn hình</div>
        <div class="lock-desc">Trò chơi yêu cầu màn hình ngang để có góc nhìn săn đuổi tốt nhất. Hãy bật tính năng tự động xoay màn hình của thiết bị.</div>
    </div>

    <button id="skill-dash-btn">
        <div class="btn-text-layer">⚡ SPEED</div>
        <div id="dash-cooldown-overlay"></div>
    </button>

    <div id="start-screen">
        <div class="title-container">
            <h1>2048 Cube</h1>
            <div class="subtitle">Arena King Multiplayer</div>
        </div>
        <div class="card">
            <input type="text" id="name-input" placeholder="NHẬP TÊN CỦA BẠN..." maxLength="14">
            <button id="start-btn">Vào Đấu Trường</button>
        </div>
    </div>

    <div id="ui">Sang: 2 - 2</div>
    <button id="toggle-lb-btn">🏆 TOP</button>
    <div id="leaderboard">
        <h3>🏆 Top 10 Arena King</h3>
        <div id="lb-content"></div>
    </div>
    <div id="kill-feed"></div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const nameInput = document.getElementById('name-input');
        const startBtn = document.getElementById('start-btn');
        const uiDiv = document.getElementById('ui');
        const leaderboardDiv = document.getElementById('leaderboard');
        const lbContent = document.getElementById('lb-content');
        const killFeed = document.getElementById('kill-feed');
        const toggleLbBtn = document.getElementById('toggle-lb-btn');

        // 3. ĐỊNH NGHĨA BIẾN NÚT BẤM TĂNG TỐC MỚI
        const dashBtn = document.getElementById('skill-dash-btn');
        const dashOverlay = document.getElementById('dash-cooldown-overlay');
        let dashCooldownActive = false;

        // 4. LOGIC XÓA MÀN HÌNH CHỜ SAU KHI TẢI XONG
        window.addEventListener('load', () => {
            const loader = document.getElementById('custom-loader-screen');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 800); // Tạo độ trễ nhỏ tạo cảm giác mượt mà
        });

        // 5. KIỂM TRA VÀ ÉP MÀN HÌNH NGANG TRÊN ĐIỆN THOẠI
        function checkOrientation() {
            const lockOverlay = document.getElementById('landscape-lock-overlay');
            // Chỉ kích hoạt cảnh báo trên thiết bị di động khi xoay dọc
            if (window.innerHeight > window.innerWidth && window.innerWidth <= 768) {
                lockOverlay.style.display = 'flex';
            } else {
                lockOverlay.style.display = 'none';
                resize();
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        let players = {};
        let cubes = [];
        let gameRunning = false;
        let targetAngle = 0;
        let floatingTexts = [];

        const MAP_WIDTH = 3000;
        const MAP_HEIGHT = 2000;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        toggleLbBtn.onclick = (e) => {
            e.stopPropagation();
            if (leaderboardDiv.style.display === 'none' || leaderboardDiv.style.display === '') {
                leaderboardDiv.style.display = 'block';
            } else {
                leaderboardDiv.style.display = 'none';
            }
        };

        // 3. EVENT XỬ LÝ KHI NGƯỜI CHƠI BẤM NÚT TĂNG TỐC X3
        dashBtn.addEventListener('click', triggerDashSkill);
        dashBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerDashSkill();
        });

        function triggerDashSkill() {
            if (!gameRunning || dashCooldownActive) return;

            // Gửi lệnh kích hoạt Skill lên Server
            socket.emit('activateDashSkill');

            // Khởi động đếm ngược 20s hồi chiêu ngay tại Client
            dashCooldownActive = true;
            dashOverlay.style.height = '100%';
            dashBtn.disabled = true;

            let cooldownLeft = 20; // 20 giây hồi chiêu
            let cdInterval = setInterval(() => {
                cooldownLeft -= 0.1;
                let percent = (cooldownLeft / 20) * 100;
                dashOverlay.style.height = `${percent}%`;

                if (cooldownLeft <= 0) {
                    clearInterval(cdInterval);
                    dashCooldownActive = false;
                    dashOverlay.style.height = '0%';
                    dashBtn.disabled = false;
                }
            }, 100);
        }

        // 1. LOẠI BỎ CHUỘT/TOUCH ĐỂ TĂNG TỐC - CHỈ ĐỂ ĐIỀU HƯỚNG GÓC XOAY
        window.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            updateMouseAngle(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (!gameRunning) return;
            let touch = e.touches[0];
            updateMouseAngle(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            let touch = e.touches[0];
            updateMouseAngle(touch.clientX, touch.clientY);
        }, { passive: true });

        function updateMouseAngle(clientX, clientY) {
            let centerX = window.innerWidth / 2;
            let centerY = window.innerHeight / 2;
            targetAngle = Math.atan2(clientY - centerY, clientX - centerX);
            // Gửi đồng bộ lên Server (Bỏ hoàn toàn biến isMouseDown cũ)
            socket.emit('updateInput', { angle: targetAngle });
        }

        startBtn.onclick = () => {
            const name = nameInput.value.trim() || "Player";
            startScreen.style.display = 'none';
            uiDiv.style.display = 'block';
            
            // Hiện nút bấm tăng tốc khi vào trận đấu
            dashBtn.style.display = 'block';
            
            if (window.innerWidth <= 768) {
                toggleLbBtn.style.display = 'block';
            } else {
                leaderboardDiv.style.display = 'block';
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();

            gameRunning = true;
            socket.emit('joinGame', { name: name });
            setTimeout(() => { resize(); window.scrollTo(0, 1); }, 400);
            animate();
        };

        socket.on('respawnData', (data) => {
            if (socket.id && serverPlayers && serverPlayers[socket.id]) {
                serverPlayers[socket.id] = data;
            }
        });

        socket.on('playClientSound', (data) => {
            if (data.floatingText) {
                let p = players[data.playerId];
                if (p && p.body && p.body.length > 0) {
                    floatingTexts.push({
                        x: p.body[0].x,
                        y: p.body[0].y - 40,
                        text: data.floatingText,
                        color: data.color || '#fbbf24',
                        alpha: 1.0,
                        life: 70
                    });
                }
            }
            if (data.playerId !== socket.id) return;
            if (data.type === 'x2') playTone(523.25, 'sine', 0.15);
            else if (data.type === 'div2') playTone(293.66, 'sine', 0.2);
            else if (data.type === 'merge') { playTone(440, 'triangle', 0.1); setTimeout(() => playTone(554.37, 'triangle', 0.15), 80); }
            else if (data.type === 'bomb') { playTone(120, 'sawtooth', 0.4); }
            else if (data.type === 'speed') { playTone(659.25, 'sine', 0.1); setTimeout(() => playTone(783.99, 'sine', 0.15), 60); }
        });

        socket.on('playerDied', (data) => {
            let msg = "";
            if (data.isBomb) {
                msg = `💥 <span style="color:#ef4444;font-weight:bold;">${data.name}</span> đã dẫm phải BOMB nổ banh xác!`;
            } else {
                msg = `⚔️ <span style="color:#fbbf24;font-weight:bold;">${data.killer}</span> đã NUỐT CHỬNG/HẠ GỤC <span style="color:#94a3b8;">${data.name}</span>! (Chuỗi: ${data.streak})`;
            }
            let div = document.createElement('div');
            div.className = 'feed-msg';
            div.innerHTML = msg;
            killFeed.appendChild(div);
            if (killFeed.children.length > 4) { killFeed.removeChild(killFeed.children[0]); }
            setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 4000);
        });

        let lastServerState = null;
        socket.on('updateState', (state) => { lastServerState = state; });

        function drawGrid(camX, camY) {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 50;
            let startX = Math.floor((camX - canvas.width / 2) / gridSize) * gridSize;
            let endX = Math.ceil((camX + canvas.width / 2) / gridSize) * gridSize;
            let startY = Math.floor((camY - canvas.height / 2) / gridSize) * gridSize;
            let endY = Math.ceil((camY + canvas.height / 2) / gridSize) * gridSize;

            for (let x = startX; x <= endX; x++) {
                if (x < 0 || x > MAP_WIDTH) continue;
                ctx.beginPath(); ctx.moveTo(canvas.width / 2 + (x - camX), 0); ctx.lineTo(canvas.width / 2 + (x - camX), canvas.height); ctx.stroke();
            }
            for (let y = startY; y <= endY; y++) {
                if (y < 0 || y > MAP_HEIGHT) continue;
                ctx.beginPath(); ctx.moveTo(0, canvas.height / 2 + (y - camY)); ctx.lineTo(canvas.width, canvas.height / 2 + (y - camY)); ctx.stroke();
            }
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 5; ctx.strokeRect(canvas.width / 2 - camX, canvas.height / 2 - camY, MAP_WIDTH, MAP_HEIGHT);
        }

        function getColorByValue(val) {
            const colors = {
                2: ['#3b82f6', '#1d4ed8'], 4: ['#10b981', '#047857'], 8: ['#f59e0b', '#b45309'],
                16: ['#06b6d4', '#0e7490'], 32: ['#14b8a6', '#0f766e'], 64: ['#8b5cf6', '#6d28d9'],
                128: ['#ec4899', '#be185d'], 256: ['#f43f5e', '#be123c'], 512: ['#e11d48', '#9f1239'],
                1024: ['#65a30d', '#3f6212'], 2048: ['#eab308', '#854d0e']
            };
            return colors[val] || ['#ef4444', '#991b1b'];
        }

        function drawCubeNode(cx, cy, val, scale, isHead, angle, name, isSelf, streak) {
            let r = 24 * scale;
            ctx.save(); ctx.translate(cx, cy);
            if (isHead) ctx.rotate(angle);

            let grads = getColorByValue(val);
            let g = ctx.createLinearGradient(-r, -r, r, r);
            g.addColorStop(0, grads[0]); g.addColorStop(1, grads[1]);
            ctx.fillStyle = g;

            ctx.shadowBlur = isSelf ? 20 : 10;
            ctx.shadowColor = grads[0];

            ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, r * 0.35); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = isHead ? 3 : 1.5;
            ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, r * 0.35); ctx.stroke();

            if (isHead) {
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.4, r * 0.18, 0, Math.PI * 2); ctx.arc(r * 0.35, r * 0.4, r * 0.18, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.4, r * 0.08, 0, Math.PI * 2); ctx.arc(r * 0.42, r * 0.4, r * 0.08, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
            ctx.save(); ctx.translate(cx, cy);
            ctx.fillStyle = '#ffffff'; ctx.font = `bold ${Math.max(11, r * 0.7)}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(val, 0, 0); ctx.restore();

            if (isHead) {
                ctx.save(); ctx.translate(cx, cy);
                ctx.fillStyle = isSelf ? '#fbbf24' : '#ffffff';
                ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                let tag = name;
                if (streak >= 3) { tag = `🔥 ${streak} ${name}`; }
                ctx.fillText(tag, 0, -r - 12); ctx.restore();
            }
        }

        function drawItem(cx, cy, type) {
            ctx.save(); ctx.translate(cx, cy);
            let r = 16;
            let bg = '#1e293b', txt = '?', border = '#ffffff';
            if (type === 'x2') { bg = '#3b82f6'; txt = 'x2'; border = '#60a5fa'; }
            else if (type === '/2') { bg = '#ef4444'; txt = '÷2'; border = '#f87171'; }
            else if (type === 'bomb') { bg = '#111827'; txt = 'BOMB'; border = '#ef4444'; }

            ctx.shadowBlur = 8; ctx.shadowColor = bg;
            ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, 6); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, 6); ctx.stroke();

            if (type === 'bomb') {
                ctx.fillStyle = '#ef4444'; ctx.font = 'bold 9px sans-serif';
            } else {
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif';
            }
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 0, 0);
            ctx.restore();
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            if (lastServerState) { players = lastServerState.players; cubes = lastServerState.cubes; }
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let myPlayer = players[socket.id];
            let camX = MAP_WIDTH / 2, camY = MAP_HEIGHT / 2;
            if (myPlayer && myPlayer.alive && myPlayer.body && myPlayer.body.length > 0) {
                camX = myPlayer.body[0].x; camY = myPlayer.body[0].y;
                let headVal = myPlayer.body[0].value;
                let score = 0; myPlayer.body.forEach(s => score += s.value);
                uiDiv.innerText = `${myPlayer.name}: ${headVal} - Tổng điểm: ${score}`;
            } else {
                uiDiv.innerText = "Đang đợi hồi sinh...";
            }

            drawGrid(camX, camY);

            cubes.forEach(c => {
                let cx = canvas.width / 2 + (c.x - camX);
                let cy = canvas.height / 2 + (c.y - camY);
                if (cx >= -30 && cx <= canvas.width + 30 && cy >= -30 && cy <= canvas.height + 30) { drawItem(cx, cy, c.type); }
            });

            let sortedPlayers = Object.values(players).filter(p => p.alive);
            sortedPlayers.sort((a, b) => { let sA = 0, sB = 0; if (a.body[0]) sA = a.body[0].value; if (b.body[0]) sB = b.body[0].value; return sA - sB; });

            sortedPlayers.forEach(p => {
                if (!p.body || p.body.length === 0) return;
                for (let i = p.body.length - 1; i >= 0; i--) {
                    let seg = p.body[i];
                    let cx = canvas.width / 2 + (seg.x - camX);
                    let cy = canvas.height / 2 + (seg.y - camY);
                    if (cx >= -100 && cx <= canvas.width + 100 && cy >= -100 && cy <= canvas.height + 100) {
                        drawCubeNode(cx, cy, seg.value, seg.baseScale, i === 0, p.angle, p.name, p.id === socket.id, p.killStreak);
                    }
                }
            });

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i]; ft.life--; ft.y -= 0.6;
                ctx.save(); ctx.fillStyle = ft.color; ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center'; ctx.globalAlpha = Math.max(0, ft.life / 70);
                let cx = canvas.width / 2 + (ft.x - camX); let cy = canvas.height / 2 + (ft.y - camY);
                ctx.fillText(ft.text, cx, cy); ctx.restore();
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            let lbArr = Object.values(players).filter(p => p.alive).map(p => {
                let sum = 0; p.body.forEach(s => sum += s.value);
                return { name: p.name, id: p.id, score: sum };
            });
            lbArr.sort((a, b) => b.score - a.score);
            let top10 = lbArr.slice(0, 10);

            let html = '';
            top10.forEach((item, index) => {
                let isSelf = (item.id === socket.id) ? ' self' : '';
                let rankIcon = (index === 0) ? '🥇 ' : (index === 1) ? '🥈 ' : (index === 2) ? '🥉 ' : `${index + 1}. `;
                let displayScore = item.score >= 1000 ? (item.score / 1000).toFixed(1) + 'K' : item.score;
                html += `<div class="lb-item${isSelf}"><span>${rankIcon}${item.name}</span><span>${displayScore}</span></div>`;
            });
            lbContent.innerHTML = html;
        }
    </script>
</body>
</html>
